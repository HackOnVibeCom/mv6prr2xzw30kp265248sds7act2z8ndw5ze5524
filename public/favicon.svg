<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="8"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.4"/>

  <!-- Main Sparkle / Rocket Emblem -->
  <g transform="translate(256, 256) scale(1.1)">
    <!-- Central Large 4-Point Sparkle Star -->
    <path d="M0 -150 C10 -50 50 -10 150 0 C50 10 10 50 0 150 C-10 50 -50 10 -150 0 C-50 -10 -10 -50 0 -150 Z" fill="url(#iconGrad)"/>
    
    <!-- Secondary Small Accent Sparkle (Top Right) -->
    <path d="M80 -80 C85 -50 100 -35 130 -30 C100 -25 85 -10 80 20 C75 -10 60 -25 30 -30 C60 -35 75 -50 80 -80 Z" fill="#6EE7B7"/>
    
    <!-- Inner Diamond Core -->
    <polygon points="0,-40 30,0 0,40 -30,0" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
